name: macOS Machine

on:
  workflow_dispatch:

jobs:
  macos-machine:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Secure Interactive SSH Session
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-users: ${{ secrets.SSH_PUBLIC_KEY }}
